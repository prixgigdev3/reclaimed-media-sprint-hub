kind = "web"
previewPath = "/"
title = "Reclaimed Media Sprint Hub"
version = "1.0.0"
id = "artifacts/sprint-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24269

[services.development]
run = "pnpm --filter @workspace/sprint-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sprint-hub", "run", "build" ]
publicDir = "artifacts/sprint-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24269"
BASE_PATH = "/"
